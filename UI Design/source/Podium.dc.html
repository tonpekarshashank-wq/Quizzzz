<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Winner cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=Instrument+Sans:wght@500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #2B4BFF;outline-offset:3px}
.btn{transition:transform .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 #12131A !important}
@keyframes fall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(880px) rotate(520deg)}}
.cf{position:absolute;top:0;box-sizing:border-box;border:2px solid #12131A;animation:fall linear infinite}
@keyframes rise{from{transform:translateY(120px);opacity:0}to{transform:none;opacity:1}}
.card{animation:rise .8s cubic-bezier(.2,1,.3,1) both}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hop{animation:hop 1.1s ease-in-out infinite}
</style>
</helmet>
<div style="position:relative;width:1360px;height:820px;box-sizing:border-box;background:#F4F2EC;color:#12131A;font-family:'Instrument Sans',sans-serif;display:flex;flex-direction:column;padding:30px 60px 32px;gap:12px;overflow:hidden">

  <sc-for list="{{ confetti }}" as="c" hint-placeholder-count="30">
    <div class="cf" style="left:{{ c.x }}px;width:{{ c.w }}px;height:{{ c.h }}px;background:{{ c.color }};border-radius:{{ c.r }};animation-duration:{{ c.dur }};animation-delay:{{ c.delay }}"></div>
  </sc-for>

  <div style="position:relative;text-align:center;display:flex;flex-direction:column;gap:6px">
    <span style="font-family:'DM Mono',monospace;font-size:15px;letter-spacing:3px;color:#2B4BFF">FRIDAY TECH TRIVIA · FINAL RESULTS</span>
    <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:58px;line-height:1;letter-spacing:-1.5px">Priya takes the crown</span>
  </div>

  <div style="position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:34px;min-height:0;padding-bottom:6px">
    <sc-for list="{{ cards }}" as="k" hint-placeholder-count="3">
      <div class="card" style="position:relative;width:{{ k.w }}px;height:{{ k.h }}px;box-sizing:border-box;border:3.5px solid #12131A;border-radius:30px;background:{{ k.bg }};box-shadow:8px 8px 0 #12131A;transform:rotate({{ k.rot }}deg);padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;animation-delay:{{ k.delay }}">
        <div style="width:100%;display:flex;align-items:center;justify-content:space-between">
          <span style="font-family:'DM Mono',monospace;font-size:46px;line-height:1">{{ k.place }}</span>
          <span style="font-family:'DM Mono',monospace;font-size:13px;letter-spacing:2px">{{ k.tag }}</span>
        </div>
        <div style="flex:1;display:flex;align-items:center;justify-content:center">
          <div class="{{ k.hop }}" style="position:relative;flex:none;width:{{ k.bs }}px;height:{{ k.bs }}px;box-sizing:border-box;background:{{ k.bc }};border:{{ k.bw }}px solid #12131A;border-radius:{{ k.br }}">
            <div style="position:absolute;{{ k.eL }}"></div><div style="position:absolute;{{ k.eR }}"></div><div style="position:absolute;{{ k.mo }}"></div>
            <sc-if value="{{ k.crown }}" hint-placeholder-val="{{ true }}"><svg width="86" height="62" viewBox="0 0 64 46" style="position:absolute;left:50%;top:-52px;transform:translateX(-50%) rotate(-8deg)"><path d="M4 40 0 8l16 14L32 0l16 22L64 8l-4 32z" fill="#FFD43B" stroke="#12131A" stroke-width="3.5" stroke-linejoin="round"/></svg></sc-if>
          </div>
        </div>
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:{{ k.nameSize }}px;line-height:1">{{ k.name }}</span>
        <span style="font-family:'DM Mono',monospace;font-size:{{ k.scoreSize }}px;line-height:1.1">{{ k.score }} pts</span>
        <div style="width:100%;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px;margin-top:6px">
          <div style="background:#fff;border:2.5px solid #12131A;border-radius:12px;padding:6px 4px;text-align:center"><div style="font-family:'DM Mono',monospace;font-size:17px">{{ k.acc }}</div><div style="font-size:11px;font-weight:700;letter-spacing:.5px">ACCURACY</div></div>
          <div style="background:#fff;border:2.5px solid #12131A;border-radius:12px;padding:6px 4px;text-align:center"><div style="font-family:'DM Mono',monospace;font-size:17px">{{ k.avg }}</div><div style="font-size:11px;font-weight:700;letter-spacing:.5px">AVG TIME</div></div>
          <div style="background:#fff;border:2.5px solid #12131A;border-radius:12px;padding:6px 4px;text-align:center"><div style="font-family:'DM Mono',monospace;font-size:17px">{{ k.streak }}</div><div style="font-size:11px;font-weight:700;letter-spacing:.5px">STREAK</div></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px">
    <div style="display:flex;gap:10px">
      <sc-for list="{{ awards }}" as="a" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid #12131A;border-radius:14px;padding:8px 14px;box-shadow:3px 3px 0 #12131A">
          <div style="width:30px;height:30px;border-radius:50%;border:2.5px solid #12131A;background:{{ a.color }}"></div>
          <div style="display:flex;flex-direction:column"><span style="font-weight:700;font-size:15px">{{ a.title }}</span><span style="font-size:13px;font-weight:600;color:#3B4152">{{ a.who }}</span></div>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;gap:12px">
      <button class="btn" style="height:54px;padding:0 20px;border-radius:16px;border:2.5px solid #12131A;background:#fff;color:#12131A;font-weight:700;font-size:16px;box-shadow:4px 4px 0 #12131A;display:flex;align-items:center;gap:10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12131A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M4 20h16"/></svg>Download CSV
      </button>
      <button class="btn" style="height:54px;padding:0 26px;border-radius:16px;border:2.5px solid #12131A;background:#FF6A2B;color:#12131A;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;box-shadow:4px 4px 0 #12131A">Play again</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const INK = '#12131A';
    const BL = [{ c: '#FF6A2B', r: '50%' }, { c: '#FF9AD5', r: '38% 62% 63% 37% / 41% 44% 56% 59%' }, { c: '#2B4BFF', r: '30%', ink: '#fff' }, { c: '#FFD43B', r: '50% 50% 18% 50%' }, { c: '#2EE6A6', r: '62% 38% 46% 54% / 55% 60% 40% 45%' }, { c: '#8FD3FF', r: '50% 50% 50% 14%' }];
    const av = (k, s, m) => {
      const b = BL[k % 6], ink = b.ink || INK, bw = Math.max(2, Math.round(s / 22)), e = Math.round(s * 0.13);
      const eye = (side) => side + ':' + Math.round(s * 0.24) + 'px;top:' + Math.round(s * 0.34) + 'px;width:' + e + 'px;height:' + e + 'px;border-radius:50%;background:' + ink;
      const mw = Math.round(s * 0.3), mh = Math.round(s * 0.15), top = Math.round(s * 0.56);
      let mo = 'left:50%;transform:translateX(-50%);top:' + top + 'px;';
      if (m === 'o') mo += 'width:' + mh + 'px;height:' + mh + 'px;border-radius:50%;background:' + ink;
      else if (m === 'grin') mo += 'width:' + mw + 'px;height:' + mh + 'px;border-radius:0 0 999px 999px;background:' + ink;
      else mo += 'width:' + mw + 'px;height:' + mh + 'px;border:' + bw + 'px solid ' + ink + ';border-top:0;border-radius:0 0 999px 999px';
      return { bs: s, bc: b.c, br: b.r, bw, eL: eye('left'), eR: eye('right'), mo };
    };
    const fmt = (n) => n.toLocaleString('en-US');
    const cards = [
      { place: '2', tag: 'RUNNER-UP', name: 'Maya', score: 8420, acc: '80%', avg: '3.4s', streak: '7', w: 310, h: 470, bg: '#8FD3FF', rot: -3, delay: '.2s', big: false, ...av(0, 140, 'grin') },
      { place: '1', tag: 'CHAMPION', name: 'Priya', score: 9150, acc: '90%', avg: '2.1s', streak: '5', w: 380, h: 540, bg: '#FFD43B', rot: 0, delay: '.5s', big: true, crown: true, hop: 'hop', ...av(1, 190, 'grin') },
      { place: '3', tag: 'PODIUM', name: 'Luis', score: 7880, acc: '70%', avg: '4.0s', streak: '4', w: 310, h: 430, bg: '#FF9AD5', rot: 3, delay: '0s', big: false, ...av(3, 130, 'smile') }
    ].map((c) => ({ ...c, score: fmt(c.score), nameSize: c.big ? 44 : 34, scoreSize: c.big ? 24 : 20, hop: c.hop || '', crown: !!c.crown }));
    const cols = ['#FF6A2B', '#FF9AD5', '#2B4BFF', '#FFD43B', '#2EE6A6', '#8FD3FF'];
    const confetti = [];
    for (let i = 0; i < 34; i++) confetti.push({ x: (i * 197) % 1330 + 10, w: 10 + (i % 3) * 5, h: 10 + (i % 4) * 4, color: cols[i % 6], r: i % 3 === 0 ? '50%' : '3px', dur: (5 + (i % 5)) + 's', delay: '-' + ((i * 0.7) % 6).toFixed(1) + 's' });
    const awards = [
      { title: 'Speed Demon', who: 'Priya · avg 2.1s', color: '#FFD43B' },
      { title: 'Hot Streak', who: 'Maya · 7 in a row', color: '#FF6A2B' },
      { title: 'Comeback Kid', who: 'Dev_42 · up 9 places', color: '#8FD3FF' }
    ];
    return { cards, confetti, awards };
  }
}
</script>
</body>
</html>
