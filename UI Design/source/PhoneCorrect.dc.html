<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player correct</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=Instrument+Sans:wght@500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-26px) scale(.96,1.06)}70%{transform:translateY(0) scale(1.06,.94)}}
.jump{animation:jump 1.1s ease-in-out infinite}
@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(880px) rotate(480deg)}}
.cf{position:absolute;top:0;box-sizing:border-box;border:2px solid #12131A;animation:fall linear infinite}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s ease-out both}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#2EE6A6;color:#12131A;font-family:'Instrument Sans',sans-serif;display:flex;flex-direction:column;align-items:center;padding:36px 22px 28px;gap:16px;overflow:hidden;text-align:center">

  <sc-for list="{{ confetti }}" as="c" hint-placeholder-count="18">
    <div class="cf" style="left:{{ c.x }}px;width:{{ c.s }}px;height:{{ c.s }}px;background:{{ c.color }};border-radius:{{ c.r }};animation-duration:{{ c.dur }};animation-delay:{{ c.delay }}"></div>
  </sc-for>

  <div class="jump" style="position:relative;width:{{ me.bs }}px;height:{{ me.bs }}px;box-sizing:border-box;background:{{ me.bc }};border:{{ me.bw }}px solid #12131A;border-radius:{{ me.br }};margin-top:6px">
    <div style="position:absolute;{{ me.eL }}"></div><div style="position:absolute;{{ me.eR }}"></div><div style="position:absolute;{{ me.mo }}"></div>
  </div>
  <span style="position:relative;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:58px;line-height:1;letter-spacing:-1.5px">Nailed it!</span>

  <div class="pop" style="position:relative;width:100%;border:3px solid #12131A;border-radius:24px;background:#fff;box-shadow:6px 6px 0 #12131A;padding:18px 20px;display:flex;flex-direction:column;gap:10px;text-align:left">
    <div style="display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:15px"><span>Double points</span><span>2,000</span></div>
    <div style="display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:15px"><span>Speed · 1.8s</span><span>× 91%</span></div>
    <div style="border-top:3px dashed #12131A;margin:2px 0"></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-weight:700;font-size:16px">You earned</span>
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:56px;line-height:1;letter-spacing:-1px">+1,820</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:15px;color:#3B4152"><span>Total</span><span>3,410</span></div>
  </div>

  <div style="position:relative;width:100%;border:3px solid #12131A;border-radius:20px;background:#12131A;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px">
      <span style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;color:#2EE6A6">STREAK · 3 IN A ROW</span>
      <div style="display:flex;gap:6px">
        <sc-for list="{{ pips }}" as="p" hint-placeholder-count="5">
          <div style="width:30px;height:30px;box-sizing:border-box;border-radius:50%;background:{{ p.bg }};border:2.5px {{ p.line }} {{ p.edge }};display:flex;align-items:center;justify-content:center">
            <sc-if value="{{ p.on }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" fill="#12131A"/></svg></sc-if>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
      <span style="display:flex;align-items:center;gap:6px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;line-height:1"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 4 21 19H3z" fill="#2EE6A6"/></svg>3rd</span>
      <span style="font-size:13px;font-weight:600;color:#B9BCCB">up 3 places</span>
    </div>
  </div>

  <span style="position:relative;font-weight:700;font-size:16px">Only 230 pts behind 2nd. Keep going!</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const INK = '#12131A';
    const BL = [{ c: '#FF6A2B', r: '50%' }, { c: '#FF9AD5', r: '38% 62% 63% 37% / 41% 44% 56% 59%' }, { c: '#2B4BFF', r: '30%', ink: '#fff' }, { c: '#FFD43B', r: '50% 50% 18% 50%' }, { c: '#2EE6A6', r: '62% 38% 46% 54% / 55% 60% 40% 45%' }, { c: '#8FD3FF', r: '50% 50% 50% 14%' }];
    const av = (k, s, m) => {
      const b = BL[k % 6], ink = b.ink || INK, bw = Math.max(2, Math.round(s / 22)), e = Math.round(s * 0.13);
      const eye = (side) => side + ':' + Math.round(s * 0.24) + 'px;top:' + Math.round(s * 0.34) + 'px;width:' + e + 'px;height:' + e + 'px;border-radius:50%;background:' + ink;
      const mw = Math.round(s * 0.3), mh = Math.round(s * 0.15), top = Math.round(s * 0.56);
      let mo = 'left:50%;transform:translateX(-50%);top:' + top + 'px;';
      if (m === 'o') mo += 'width:' + mh + 'px;height:' + mh + 'px;border-radius:50%;background:' + ink;
      else if (m === 'grin') mo += 'width:' + mw + 'px;height:' + mh + 'px;border-radius:0 0 999px 999px;background:' + ink;
      else mo += 'width:' + mw + 'px;height:' + mh + 'px;border:' + bw + 'px solid ' + ink + ';border-top:0;border-radius:0 0 999px 999px';
      return { bs: s, bc: b.c, br: b.r, bw, eL: eye('left'), eR: eye('right'), mo };
    };
    const cols = ['#FF6A2B', '#FF9AD5', '#FFD43B', '#fff', '#8FD3FF'];
    const confetti = [];
    for (let i = 0; i < 22; i++) confetti.push({ x: (i * 53) % 370 + 6, s: 10 + (i % 3) * 4, color: cols[i % 5], r: i % 2 ? '50%' : '3px', dur: (4 + (i % 4)) + 's', delay: '-' + ((i * 0.6) % 5).toFixed(1) + 's' });
    return {
      me: av(0, 130, 'grin'), confetti,
      pips: [0, 1, 2, 3, 4].map((i) => (i < 3 ? { on: true, bg: '#FFD43B', line: 'solid', edge: '#FFD43B' } : { on: false, bg: 'transparent', line: 'dashed', edge: '#6A6F82' }))
    };
  }
}
</script>
</body>
</html>
