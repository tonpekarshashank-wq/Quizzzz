<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player wrong answer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=Instrument+Sans:wght@500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.wob{animation:wobble 1.6s ease-in-out infinite}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FF9AD5;color:#12131A;font-family:'Instrument Sans',sans-serif;display:flex;flex-direction:column;align-items:center;padding:40px 22px 28px;gap:18px;overflow:hidden;text-align:center">

  <div class="wob" style="position:relative;width:{{ me.bs }}px;height:{{ me.bs }}px;box-sizing:border-box;background:{{ me.bc }};border:{{ me.bw }}px solid #12131A;border-radius:{{ me.br }};margin-top:10px">
    <div style="position:absolute;{{ me.eL }}"></div><div style="position:absolute;{{ me.eR }}"></div>
    <div style="position:absolute;left:50%;transform:translateX(-50%);top:84px;width:40px;height:20px;border:6px solid #12131A;border-bottom:0;border-radius:999px 999px 0 0"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:58px;line-height:1;letter-spacing:-1.5px">So close!</span>
    <span style="font-weight:600;font-size:18px">No points this round.</span>
  </div>

  <div style="width:100%;border:3px solid #12131A;border-radius:24px;background:#fff;box-shadow:6px 6px 0 #12131A;padding:16px 18px;display:flex;flex-direction:column;gap:12px;text-align:left">
    <span style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;color:#3B4152">THE RIGHT ANSWER</span>
    <div style="display:flex;align-items:center;gap:16px">
      <div style="flex:none;width:62px;height:62px;border:3px solid #12131A;border-radius:15px;background:#FFD43B;display:flex;align-items:center;justify-content:center"><svg width="32" height="32" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#12131A"/></svg></div>
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:36px">Saturn</span>
    </div>
    <div style="border-top:3px dashed #12131A"></div>
    <span style="font-weight:600;font-size:15px;line-height:1.4;color:#3B4152">You picked Mars. 58% of the room got this one right.</span>
  </div>

  <div style="width:100%;display:flex;gap:12px">
    <div style="flex:1;border:3px solid #12131A;border-radius:20px;background:#12131A;color:#fff;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px">
      <span style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;color:#FF9AD5">RANK</span>
      <span style="display:flex;align-items:center;gap:6px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;line-height:1"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 20 3 5h18z" fill="#FF9AD5"/></svg>5th</span>
      <span style="font-size:13px;font-weight:600;color:#B9BCCB">down 2 places</span>
    </div>
    <div style="flex:1;border:3px solid #12131A;border-radius:20px;background:#fff;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px">
      <span style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;color:#3B4152">STREAK</span>
      <div style="display:flex;gap:5px">
        <sc-for list="{{ pips }}" as="p" hint-placeholder-count="5">
          <div style="width:20px;height:20px;box-sizing:border-box;border-radius:50%;border:2.5px dashed #12131A"></div>
        </sc-for>
      </div>
      <span style="font-size:13px;font-weight:600;color:#3B4152">Start a new one</span>
    </div>
  </div>

  <span style="font-weight:700;font-size:17px;margin-top:auto">Only 125 pts behind 4th. Next one's yours!</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = 140, bw = 6, e = 18;
    const eye = (side) => side + ':34px;top:48px;width:' + e + 'px;height:' + e + 'px;border-radius:50%;background:#12131A';
    return { me: { bs: s, bc: '#8FD3FF', br: '50% 50% 50% 14%', bw, eL: eye('left'), eR: eye('right') }, pips: [0, 1, 2, 3, 4] };
  }
}
</script>
</body>
</html>
