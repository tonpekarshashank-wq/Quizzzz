<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Question live</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=Instrument+Sans:wght@500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(2deg)}}
.stk{animation:wob 2.4s ease-in-out infinite}
@keyframes burn{from{width:100%}to{width:0%}}
.fuse{animation:burn 30s linear both}
</style>
</helmet>
<div style="width:1360px;height:820px;box-sizing:border-box;display:flex;overflow:hidden;font-family:'Instrument Sans',sans-serif;color:#12131A">

  <div style="width:500px;flex:none;box-sizing:border-box;background:#2B4BFF;color:#fff;padding:40px 44px;display:flex;flex-direction:column;justify-content:space-between;border-right:3px solid #12131A">
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-family:'DM Mono',monospace;font-size:18px;background:#fff;color:#12131A;border:2.5px solid #12131A;border-radius:12px;padding:6px 14px">Q3 / 10</span>
      <span class="stk" style="font-family:'DM Mono',monospace;font-size:16px;letter-spacing:1px;background:#FFD43B;color:#12131A;border:2.5px solid #12131A;border-radius:12px;padding:6px 14px;box-shadow:3px 3px 0 #12131A">2× POINTS</span>
    </div>
    <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:64px;line-height:1.02;letter-spacing:-1.5px">Which planet has the most known moons?</div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span style="font-family:'DM Mono',monospace;font-size:14px;letter-spacing:2px">TIME LEFT</span>
        <span style="font-family:'DM Mono',monospace;font-size:72px;line-height:1;color:#FFD43B">18</span>
      </div>
      <div style="height:26px;border:3px solid #12131A;border-radius:999px;background:#1B30C4;overflow:hidden"><div class="fuse" style="width:60%;height:100%;background:#FFD43B;border-right:3px solid #12131A"></div></div>
    </div>
  </div>

  <div style="flex:1;min-width:0;box-sizing:border-box;background:#F4F2EC;padding:36px 48px 40px;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:20px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px">17 of 24 locked in</span>
        <span style="font-size:15px;font-weight:600;color:#3B4152">Answers stay secret until time's up.</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;max-width:340px;justify-content:flex-end">
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="24">
          <div style="width:24px;height:24px;box-sizing:border-box;border-radius:50%;background:{{ d.bg }};border:2.5px {{ d.line }} #12131A"></div>
        </sc-for>
      </div>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;gap:16px;min-height:0">
      <div style="flex:1;display:flex;align-items:center;gap:26px;border:3px solid #12131A;border-radius:26px;background:#fff;box-shadow:6px 6px 0 #12131A;padding:0 26px 0 20px">
        <div style="width:86px;height:86px;flex:none;border:3px solid #12131A;border-radius:20px;background:#FF6A2B;display:flex;align-items:center;justify-content:center"><svg width="46" height="46" viewBox="0 0 24 24"><path d="M12 3 22 20H2z" fill="#12131A"/></svg></div>
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px">Mars</span>
      </div>
      <div style="flex:1;display:flex;align-items:center;gap:26px;border:3px solid #12131A;border-radius:26px;background:#fff;box-shadow:6px 6px 0 #12131A;padding:0 26px 0 20px">
        <div style="width:86px;height:86px;flex:none;border:3px solid #12131A;border-radius:20px;background:#2B4BFF;display:flex;align-items:center;justify-content:center"><svg width="46" height="46" viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z" fill="#fff"/></svg></div>
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px">Jupiter</span>
      </div>
      <div style="flex:1;display:flex;align-items:center;gap:26px;border:3px solid #12131A;border-radius:26px;background:#fff;box-shadow:6px 6px 0 #12131A;padding:0 26px 0 20px">
        <div style="width:86px;height:86px;flex:none;border:3px solid #12131A;border-radius:20px;background:#FFD43B;display:flex;align-items:center;justify-content:center"><svg width="46" height="46" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#12131A"/></svg></div>
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px">Saturn</span>
      </div>
      <div style="flex:1;display:flex;align-items:center;gap:26px;border:3px solid #12131A;border-radius:26px;background:#fff;box-shadow:6px 6px 0 #12131A;padding:0 26px 0 20px">
        <div style="width:86px;height:86px;flex:none;border:3px solid #12131A;border-radius:20px;background:#2EE6A6;display:flex;align-items:center;justify-content:center"><svg width="46" height="46" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="#12131A"/></svg></div>
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px">Neptune</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const cols = ['#FF6A2B', '#FF9AD5', '#2B4BFF', '#FFD43B', '#2EE6A6', '#8FD3FF'];
    const dots = [];
    for (let i = 0; i < 24; i++) dots.push(i < 17 ? { bg: cols[i % 6], line: 'solid' } : { bg: 'transparent', line: 'dashed' });
    return { dots };
  }
}
</script>
</body>
</html>
