<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player answer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=Instrument+Sans:wght@500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #2B4BFF;outline-offset:3px}
.ans{transition:transform .08s, opacity .2s}
.ans:active{transform:translate(3px,3px);box-shadow:0 0 0 #12131A !important}
@keyframes burn{from{width:100%}to{width:0%}}
.fuse{animation:burn 30s linear both}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out both}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F2EC;color:#12131A;font-family:'Instrument Sans',sans-serif;display:flex;flex-direction:column;padding:22px 16px 20px;gap:14px;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <span style="font-family:'DM Mono',monospace;font-size:14px;background:#fff;border:2px solid #12131A;border-radius:9px;padding:4px 10px">Q3 / 10</span>
    <span style="font-family:'DM Mono',monospace;font-size:14px;background:#FFD43B;border:2px solid #12131A;border-radius:9px;padding:4px 10px;box-shadow:2px 2px 0 #12131A">2× POINTS</span>
    <span style="font-family:'DM Mono',monospace;font-size:20px">2,140</span>
  </div>
  <div style="height:16px;flex:none;border:2.5px solid #12131A;border-radius:999px;background:#fff;overflow:hidden"><div class="fuse" style="width:60%;height:100%;background:#FF6A2B;border-right:2.5px solid #12131A"></div></div>

  <div style="flex:none;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.5px;padding:6px 2px 4px">Which planet has the most known moons?</div>

  <div style="flex:1;display:flex;flex-direction:column;gap:12px;min-height:0">
    <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="4">
      <button class="ans" onClick="{{ t.pick }}" aria-label="{{ t.label }}" style="flex:1;min-height:0;border:3px solid #12131A;border-radius:22px;background:{{ t.bg }};color:{{ t.ink }};box-shadow:{{ t.shadow }};opacity:{{ t.opacity }};display:flex;align-items:center;gap:18px;padding:0 18px 0 14px;text-align:left">
        <div style="flex:none;width:58px;height:58px;border:3px solid #12131A;border-radius:14px;background:{{ t.color }};display:flex;align-items:center;justify-content:center">
          <sc-if value="{{ t.isTri }}" hint-placeholder-val="{{ true }}"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 3 22 20H2z" fill="#12131A"/></svg></sc-if>
          <sc-if value="{{ t.isDia }}"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z" fill="#fff"/></svg></sc-if>
          <sc-if value="{{ t.isCir }}"><svg width="30" height="30" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#12131A"/></svg></sc-if>
          <sc-if value="{{ t.isSqu }}"><svg width="30" height="30" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="#12131A"/></svg></sc-if>
        </div>
        <span style="flex:1;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px">{{ t.label }}</span>
        <sc-if value="{{ t.chosen }}" hint-placeholder-val="{{ false }}"><span class="pop" style="flex:none;width:36px;height:36px;border-radius:50%;background:#2EE6A6;border:2.5px solid #12131A;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12131A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span></sc-if>
      </button>
    </sc-for>
  </div>

  <div style="flex:none;height:52px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;text-align:center;color:#3B4152">
    <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}"><span>Tap fast. Speed earns points.</span></sc-if>
    <sc-if value="{{ locked }}"><span class="pop" style="display:flex;align-items:center;gap:8px;background:#12131A;color:#fff;border-radius:999px;padding:10px 18px">Locked in · waiting for 7 more</span></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: -1 }; }
  renderVals() {
    const items = [['Mars', '#FF6A2B', 'isTri'], ['Jupiter', '#2B4BFF', 'isDia'], ['Saturn', '#FFD43B', 'isCir'], ['Neptune', '#2EE6A6', 'isSqu']];
    const p = this.state.picked;
    return {
      open: p < 0, locked: p >= 0,
      tiles: items.map(([label, color, k], i) => {
        const sel = p === i;
        const t = { label, color, chosen: sel,
          bg: sel ? '#2B4BFF' : '#fff', ink: sel ? '#fff' : '#12131A', opacity: p >= 0 && !sel ? 0.45 : 1,
          shadow: p >= 0 ? (sel ? '5px 5px 0 #12131A' : 'none') : '5px 5px 0 #12131A',
          isTri: false, isDia: false, isCir: false, isSqu: false,
          pick: () => { if (this.state.picked < 0) this.setState({ picked: i }); } };
        t[k] = true; return t;
      })
    };
  }
}
</script>
</body>
</html>
